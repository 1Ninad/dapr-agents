# Dapr pub/sub component configuration.
# Uses Redis (started by 'dapr init' automatically).
# In production, replace with Kafka, Azure Service Bus, etc.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: agent-pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6379
    - name: redisPassword
      value: ""
